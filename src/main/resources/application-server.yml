eureka:
  instance:
    appname: NEW-IDENTITY-SERVICE
    status-page-url: https://gateway.panomete.com/api/v1/identity/actuator/info
    health-check-url: https://gateway.panomete.com/api/v1/identity/actuator/health
  client:
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://panomete-service-discovery:8761/eureka/
    healthcheck:
      enabled: true
springdoc:
  api-docs:
    path: /api/v1/identity/api-docs
  swagger-ui:
    path: /api/v1/identity/swagger-ui.html
    syntax-highlight:
      theme: monokai
      activated: true
    try-it-out-enabled: true
    tags-sorter: alpha
    filter: true
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, features"